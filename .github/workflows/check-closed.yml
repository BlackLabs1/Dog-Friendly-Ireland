name: Remove permanently closed places

on:
  schedule:
    - cron: '41 3 2 * *'   # 2nd of each month, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask Google which places have permanently closed
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: node scripts/check-closed.js
      - name: Save the list (the nightly update then leaves these places out)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/closed.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update permanently closed places" && git push)
