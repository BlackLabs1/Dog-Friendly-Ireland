name: Probe sources (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/probe/probe.js
      - name: Save results to the probe-results branch
        run: |
          cd probe-out
          git init -q -b probe-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Probe results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
