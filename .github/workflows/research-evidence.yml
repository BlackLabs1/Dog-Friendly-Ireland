name: Research evidence for unconfirmed places

on:
  workflow_dispatch:
    inputs:
      start:
        description: First place (0-based)
        default: '0'
      count:
        description: How many places
        default: '10000'
      script:
        description: evidence (places' own sources and websites) or corpus (guide pages in data/research/corpus.txt)
        default: evidence
      corpus:
        description: file in data/research listing the guide pages
        default: corpus.txt
      only:
        description: optional file listing place ids to check (evidence script only)
        default: ''

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: inputs.script == 'evidence'
        run: node scripts/research-evidence.js "${{ inputs.start }}" "${{ inputs.count }}"
        env:
          ONLY: ${{ inputs.only }}
      - if: inputs.script == 'corpus'
        run: node scripts/research-corpus.js
        env:
          CORPUS: ${{ inputs.corpus }}
