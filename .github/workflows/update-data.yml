name: Update places and publish

on:
  schedule:
    - cron: '17 4 * * *'   # every night at 04:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer run already includes everything, so stop the older one

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download places and locate researched ones
        id: data
        continue-on-error: true   # if the map server is busy, publish with the previous data
        env:
          QUICK: ${{ github.event_name == 'push' && '1' || '0' }}   # a pushed change reuses today's map data; the nightly run downloads it fresh
        run: node scripts/build-data.js
      - name: Save the updated data file
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update places"
          # Another run may have saved while this one worked (an older, cancelled run can still save at the last moment).
          # Keep other people's changes, but where the generated data clashes keep this run's copy: it is the newest build.
          git pull --rebase -X theirs origin main || { git rebase --abort; echo "Couldn't combine with newer changes; skipping save."; exit 0; }
          # GitHub sometimes refuses a push for a moment; try a few times
          for i in 1 2 3 4; do git push && break; sleep 20; git pull --rebase -X theirs origin main || { git rebase --abort; exit 0; }; done
      - uses: actions/configure-pages@v5
      - name: Stamp the app version (so phones pick up any change to the app's code)
        run: |
          v=$(cat index.html css/*.css js/*.js manifest.webmanifest | sha1sum | cut -c1-8)
          sed -i "s/var VERSION = 'dfi-[^']*'/var VERSION = 'dfi-$v'/" sw.js
          sed -i "s/var APP_VERSION = '[^']*'/var APP_VERSION = '$v'/" js/app.js
          echo "App version $v"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
